{% extends "base.html" %}
{% block title %}Acceso Reclutador{% endblock %}

{% block content %}
<div style="min-height:78vh;display:flex;align-items:center;justify-content:center;">
  <div class="card" style="width:100%;max-width:420px;padding:44px;">

    <div style="width:52px;height:52px;background:rgba(26,86,219,0.12);border:1px solid rgba(26,86,219,0.3);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin-bottom:24px;">🔐</div>

    <h2 style="font-size:1.8rem;font-weight:800;margin-bottom:6px;background:linear-gradient(135deg,#fff 40%,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
      Acceso Reclutador
    </h2>
    <p style="color:var(--gray);font-size:0.85rem;margin-bottom:32px;">
      Ingresa tus credenciales para gestionar vacantes y candidatos.
    </p>

    <form method="POST" action="/login" style="display:flex;flex-direction:column;gap:16px;">
      <div class="field">
        <label class="field-label">Correo electrónico</label>
        <input type="email" name="email" class="field-input" placeholder="reclutador@empresa.com" required />
      </div>
      <div class="field">
        <label class="field-label">Contraseña</label>
        <input type="password" name="password" class="field-input" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:14px;">
        Ingresar →
      </button>
    </form>

  </div>
</div>
{% endblock %}
